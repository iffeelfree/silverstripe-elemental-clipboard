---
Name: elementclipboard
After:
  - '#elemental'
---

# Controller route
SilverStripe\Control\Director:
  rules:
    'admin/elementclipboard//$Action': 'Ifeelfree\ElementalClipboard\ElementClipboardController'

# Load the React bundle + styles into the CMS, after elemental's own bundle.
# The bundle registers Injector transforms on ElementActions / ElementToolbar.
SilverStripe\Admin\LeftAndMain:
  extra_requirements_javascript:
    - 'ifeelfree/silverstripe-elemental-clipboard:client/dist/js/bundle.js'
  extra_requirements_css:
    - 'ifeelfree/silverstripe-elemental-clipboard:client/dist/styles/bundle.css'

# ── Opt-out specific relations from auto-discovery (optional) ─────────────────
# Example: skip relations that shouldn't be cloned (link tracking, tags, etc.)
#
# DNADesign\Elemental\Models\ElementContent:
#   clipboard_exclude_relations:
#     - LinkTracking
