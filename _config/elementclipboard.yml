---
Name: elementclipboard
---

# Controller route
SilverStripe\Control\Director:
  rules:
    'admin/elementclipboard//$Action': 'Ifeelfree\ElementalClipboard\ElementClipboardController'

# Load JS + CSS into CMS admin
SilverStripe\Admin\LeftAndMain:
  extensions:
    - Ifeelfree\ElementalClipboard\ElementClipboardAdminExtension

